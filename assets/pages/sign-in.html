<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laura Coffee-Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dynalight&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/sign-in.css">
</head>
<body>
 
  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <img src="../img/img-sign-in/logo_coffe.svg" alt="Laura Coffee logo">
      </div>
    <div class="coffee beans">
      <img class="bean bean1" src="../img/img-sign-in/bg_img_hero.svg" alt="">
    </div>
  </header>
 
  <!-- SIGN IN -->
  <section class="signin-wrap">
    <div class="wave-bg"></div>
    <!-- <img class="coffee-icon" src="assets/img-sign-in/bg-hero-ok.png" alt="Laura Coffee logo">
    <img class="coffee-icon2" src="assets/img-sign-in/bg-hero-ok.png" alt="Laura Coffee logo">
    <img class="coffee-icon3" src="assets/img-sign-in/bg-hero-ok.png" alt="Laura Coffee logo">
    <img class="coffe-icon4" src="assets/img-sign-in/bg-hero-ok.png" alt="Laura Coffee logo"> -->
    <div class="cup-photo">
      <img src="../img/img-sign-in/img-hero.svg" alt="Coffee cup">
    </div>
 
    <div class="signin-card">
      <h1>Sign in</h1>
      <form>
        <input class="container" type="text" placeholder="Email/Username" required>
        <input class="container" type="password" placeholder="Password" required>
        <button class="container-signin" type="submit">Sign in</button>
      </form>
      <a href="../pages/register.html" class="create-account">Create new account</a>
    </div>
  </section>
 
  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-grid">
      <div class="footer-brand">
        <h2>Laura Coffee</h2>
        <p>12 Nguyễn Văn Bảo, Phường Hạnh Thông, Quận Gò Vấp, Thành phố Hồ Chí Minh</p>
      </div>
 
      <div class="footer-signin">
        <h3>Links</h3>
        <ul>
          <li><a href="../../index.html">Home</a></li>
          <li><a href="../pages/menu.html">Menu</a></li>
          <li><a href="../pages/about.html">About us</a></li>
        </ul>
      </div>
 
      <div class="footer-signin">
        <h3>Help</h3>
        <ul>
          <li><a href="#">Payment Options</a></li>
          <li><a href="#">Returns</a></li>
          <li><a href="#">Privacy Policies</a></li>
        </ul>
      </div>
 
      <div class="footer-signin">
        <h3>Newsletter</h3>
        <div class="newsletter-input">
          <input type="email" placeholder="Enter Your Email Address">
          <button type="button">SUBSCRIBE</button>
        </div>
      </div>
    </div>
 
    <div class="footer-bottom">2026 Laura Coffee. All rights reserved</div>
  </footer>
 
</body>
</html>
